<div class="container mt-5">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-12 py-5 px-5">
          @if(loading){
            <div class="text-center">
              <div class="spinner-grow" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          }@else {
            <pinch-zoom>
              <img src="{{product?.image}}" alt="{{product?.title}}" class="img-fluid">
            </pinch-zoom>
          }
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12">
          @if(loading){
            <div class="text-center">
              <div class="spinner-grow" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          }@else {
            <h1 class="mb-3">{{product?.title}}</h1>
            <h2>{{product?.category | uppercase }}</h2>
            <h3 class="mb-3">{{product?.price | currency}}</h3>
            <p class="mb-3">{{product?.description}}</p>
            <div class="mt-3 d-block">
              <button onclick="addProductToCart(product)" class="btn-outline-secondary mt-3 product-button">
                <i class="bi bi-bag-plus-fill me-2"></i> Add to cart
              </button>
            </div>
          }
        </div>
    </div>
</div>
