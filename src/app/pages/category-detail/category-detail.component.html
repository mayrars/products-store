<div class="container mt-5">
    <h1>{{title | titlecase}}</h1>
    <div class="row">
      @defer {
          <div class="d-flex justify-content-end align-center">
              <div class="dropdown ml-2">
                  <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                 Sort
                  </button>
                  <ul class="dropdown-menu">
                      <li><a class="dropdown-item" (click)="onSelect('asc')">Asc</a></li>
                      <li><a class="dropdown-item" (click)="onSelect('desc')">Desc</a></li>
                  </ul>
              </div>
          </div>
          @for(product of productsList; track product.id){
            <app-product-card [product]="product" [loader]="true" class="col-4 col-md-3 col-sm-6 my-3 mt-5"/>
          }@empty{
            <div class="col-12 d-flex justify-content-center">
              <div class="spinner-grow" style="width: 5rem; height: 5rem;" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          }
        } @placeholder (minimum 300ms) {
          <div class="row">
            <app-skeleton
              class="col-12"
              [count]="20"
              [theme]="[
                { width: '20px' },
                { width: '60%' },
                { width: '70%' }
              ]"/>
          </div>
        }
    </div>
</div>
